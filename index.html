<script id="cv-live-adapter">
window.CVLiveAdapter=(function(){
  const SERVER='Google Drive';
  const SRC={backend:'1It4a7gEvyxr-gz4SL6gClC84o6mfxjr9Ooho_DxjL9o',reporting:'1IprTN7Pbzpkr7qNzC4XK4TW7_9uqbXco4p-AdHxtxAI'};
  const STALE_HOURS=72;
  const REQUIRED=['ID','PurchaseDate','ItemName','PurchaseCost','Status','SoldDate','SoldPrice'];
  const KEY_NAME='cv-key';   /* the access key lives in this browser only */
  const inPreview=()=>!!(window.claude&&typeof window.claude.use==='function');
  const endpoint=()=>String(window.CV_ENDPOINT||'').trim();
  const useEndpoint=()=>!!endpoint()&&!inPreview();

  /* Reads the key from the private link (#k=...) once, saves it, and removes it from the address bar. */
  function accessKey(){
    try{
      const m=/[#&]k=([^&]+)/.exec(location.hash||'');
      if(m){
        localStorage.setItem(KEY_NAME,decodeURIComponent(m[1]));
        history.replaceState(null,'',location.pathname+location.search+'#/overview');
      }
      return localStorage.getItem(KEY_NAME)||'';
    }catch(e){return '';}
  }

  function b64ToText(b64){
    const bin=atob(String(b64).replace(/\s/g,''));
    if(typeof TextDecoder!=='undefined'){const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder('utf-8').decode(u);}
    return decodeURIComponent(escape(bin));
  }
  function parseCSV(text){
    const rows=[];let row=[],f='',q=false;
    text=text.replace(/^\uFEFF/,'');
    for(let i=0;i<text.length;i++){
      const c=text[i];
      if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
      else if(c==='"')q=true;
      else if(c===','){row.push(f);f='';}
      else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
      else f+=c;
    }
    if(f!==''||row.length){row.push(f);rows.push(row);}
    return rows.filter(r=>!(r.length===1&&r[0]===''));
  }
  const num=x=>{x=String(x==null?'':x).replace(/[,\s\u20B1]/g,'');if(x==='')return null;const n=parseFloat(x);return isFinite(n)?n:null;};
  const dateOk=s=>/^\d{4}-\d{2}-\d{2}$/.test(s)?s:null;
  const rid=u=>{const m=/\/d\/([^\/]+)\//.exec(u||'');return m?m[1]:null;};
  const gradeOf=n=>{const m=/\b(PSA|BGS|SGC|CGC)\s?(\d+(?:\.\d)?)/i.exec(n||'');return m?m[1].toUpperCase()+' '+m[2]:'Raw';};

  /* A whitelisted card row from the sheet export. Buyer names become anonymous labels here. */
  function rawFromRow(r,ix,buyers,ctr){
    const g=h=>(ix[h]!=null&&r[ix[h]]!=null?String(r[ix[h]]).trim():'');
    const sold=g('SoldTo');
    if(sold&&!(sold in buyers))buyers[sold]='B'+(++ctr.n);
    return {id:g('ID'),name:g('ItemName'),purchaseDate:g('PurchaseDate'),purchaseCost:num(g('PurchaseCost')),status:g('Status'),soldDate:g('SoldDate'),soldPrice:num(g('SoldPrice')),
      shipMethod:g('ShippingMethod'),shipFee:num(g('ShippingFee'))||0,shipRecorded:g('ShippingRecorded').toUpperCase()==='TRUE',buyerRef:sold?buyers[sold]:'',rIn:rid(g('PurchaseReceiptURL')),rOut:rid(g('SaleReceiptURL'))};
  }
  /* Whitelisted raw cards (from either source) -> report cards. Pure. */
  function build(raws,asOf){
    const seen={},cards=[],statusCounts={};let dupes=0,badRows=0;
    raws.forEach(x=>{
      const id=String(x.id||'').trim();if(!id)return;
      if(seen[id]){dupes++;return;}
      seen[id]=1;
      const raw=String(x.status||'').trim(),key=raw.toLowerCase().replace(/[\s-]/g,'');
      statusCounts[raw||'(blank)']=(statusCounts[raw||'(blank)']||0)+1;
      const status=key==='onhand'?'onhand':(key==='sold'||key==='shipped'||key==='delivered')?'sold':(key==='traded'||key==='trade')?'traded':'review';
      const pd=dateOk(x.purchaseDate),cost=x.purchaseCost;
      if(cost==null||!pd){badRows++;return;}
      const fee=Number(x.shipFee)||0;
      cards.push({id,name:x.name||'(unnamed card)',sub:id,grade:gradeOf(x.name),source:'Purchase',channel:x.shipMethod||(status==='traded'?'Trade':''),status,rawStatus:raw,
        purchaseDate:pd,purchaseCost:cost,soldDate:dateOk(x.soldDate),soldPrice:x.soldPrice==null?null:x.soldPrice,
        expenses:fee>0?[{type:'Shipping fee (as recorded on the card)',amount:fee}]:[],flags:[],
        buyerRef:x.buyerRef||null,rIn:x.rIn||null,rOut:x.rOut||null,shipRecorded:!!x.shipRecorded});
    });
    /* trade groups: a receipt used as the sale receipt of traded cards and as the purchase receipt of cards received */
    const given={},recv={};
    cards.forEach(c=>{if(c.status==='traded'&&c.rOut)(given[c.rOut]=given[c.rOut]||[]).push(c);});
    cards.forEach(c=>{if(c.rIn&&given[c.rIn]){c.source='Trade';c.channel='Trade';(recv[c.rIn]=recv[c.rIn]||[]).push(c);}});
    const tradeGroups=Object.keys(given).filter(k=>recv[k]).map(k=>({given:given[k].length,givenValue:given[k].reduce((a,c)=>a+(c.soldPrice||0),0),received:recv[k].length,receivedCost:recv[k].reduce((a,c)=>a+c.purchaseCost,0)}));
    cards.forEach(c=>{
      if(c.status==='review')c.flags.push('status-unrecognized');
      if(c.status==='traded')c.flags.push('trade-valuation');
      if(c.status==='onhand'&&c.source==='Trade')c.flags.push('cost-basis-estimated');
      if(c.status==='sold'&&c.soldPrice===0)c.flags.push('zero-price');
      if(c.status==='sold'&&c.expenses.length&&!c.shipRecorded)c.flags.push('ship-not-recorded');
      if(c.status==='sold'&&!c.soldDate)c.flags.push('status-unrecognized');
      delete c.rIn;delete c.rOut;
    });
    CVCalc.derive(cards);
    return {cards,dupes,badRows,statusCounts,tradeGroups,asOf};
  }
  /* CSV rows of the Cards tab -> report cards. */
  function toSnapshot(rows,asOf){
    if(!rows.length)throw {code:'layout',message:'The Cards tab came back empty.'};
    const H=rows[0].map(h=>h.trim()),ix={};H.forEach((h,i)=>{if(!(h in ix))ix[h]=i;});
    const missing=REQUIRED.filter(h=>!(h in ix));
    if(missing.length)throw {code:'layout',message:'The Cards tab is missing expected columns: '+missing.join(', ')+'.'};
    const buyers={},ctr={n:0};
    return build(rows.slice(1).map(r=>rawFromRow(r,ix,buyers,ctr)),asOf);
  }
  function parseOverview(text){
    const rows=parseCSV(text),map={};
    rows.slice(1).forEach(r=>{if(r.length>=3){const v=num(r[2]);if(v!=null)map[r[1].trim()]=v;}});
    return map;
  }
  function freshness(mod,now){
    const out={};
    ['backend','reporting'].forEach(k=>{out[k]=mod[k]?{iso:mod[k],hours:(now-Date.parse(mod[k]))/36e5}:null;});
    const b=out.backend,rp=out.reporting;
    let level='ok',title='',text='';
    if(b&&b.hours>STALE_HOURS){level='warn';title='Source data may be stale';text='The Backend workbook was last edited '+Math.floor(b.hours/24)+' days ago.';}
    else if(b&&rp&&Date.parse(b.iso)-Date.parse(rp.iso)>36e5){level='warn';title='Reporting copy may be behind';text='The Court Vision 2.0 reporting copy was edited before the latest change to the Backend workbook.';}
    else if(!b&&!rp){level='info';title='Source edit time unavailable';text='The last edit time of the workbook was not returned.';}
    out.level=level;out.title=title;out.text=text;
    return out;
  }
  function commonChecks(p,add){
    add(p.dupes?'warn':'ok','Unique records',p.cards.length+' card records read'+(p.dupes?'; '+p.dupes+' repeated IDs ignored':'; no repeated IDs')+(p.badRows?'; '+p.badRows+' rows skipped for a missing date or cost':'')+'.');
    const sc=Object.keys(p.statusCounts).map(k=>k+': '+p.statusCounts[k]).join(', ');
    const unk=p.cards.filter(c=>c.status==='review').length;
    add(unk?'warn':'ok','Card statuses',sc+'.'+(unk?' '+unk+' cards have a status the workbook does not recognize and are excluded from totals.':''));
  }
  function tradeChecks(p,add){
    p.tradeGroups.forEach((t,i)=>add(t.givenValue===t.receivedCost?'ok':'warn','Trade '+(i+1)+' balances',t.given+' cards given at '+CVU.peso(t.givenValue)+' and '+t.received+' received recorded at '+CVU.peso(t.receivedCost)+(t.givenValue===t.receivedCost?'.':'. They differ.')));
  }
  function buildChecks(p,ovMap,fr,ovError){
    const C=[],add=(s,t,d)=>C.push({s,t,d});
    add('ok','Connection','Read the Backend workbook (Cards tab) through your Google Drive connector, read-only. Nothing is written back.');
    commonChecks(p,add);
    if(ovMap){
      const money=l=>/cost|price|profit|value/i.test(l);
      CVCalc.crossCheck(p.cards,ovMap).forEach(x=>add(x.status==='match'?'ok':x.status==='differs'?'warn':'na','Matches the workbook: '+x.label,x.status==='na'?'The Overview did not report this figure.':'This page: '+(money(x.label)?CVU.peso(x.page):x.page)+' \u00B7 workbook: '+(money(x.label)?CVU.peso(x.workbook):x.workbook)+(x.status==='differs'?'. The reporting copy may be out of date or a rule differs.':'.')));
      const e=ovMap['Errors'],w=ovMap['Warnings'];
      if(e!=null||w!=null)add((e||0)+(w||0)>0?'warn':'ok','The workbook\'s own data checks',(e||0)+' errors and '+(w||0)+' warnings are reported on its Overview tab. They are not re-run here.');
    } else add('na','Cross-check with the reporting copy',ovError||'The Court Vision 2.0 Overview could not be read, so totals were not compared.');
    tradeChecks(p,add);
    if(fr.level!=='ok'&&fr.title)add(fr.level==='warn'?'warn':'na',fr.title,fr.text);
    add('na','Not available through this connection','Finance ledger, Balance counts, Receipts and Users tabs are not read. Cash, reserve transfers, reserve balance, shipping reimbursements and suspected duplicate ledger rows cannot be checked here.');
    return C;
  }
  function buildChecksEndpoint(p,d,fr){
    const C=[],add=(s,t,x)=>C.push({s,t,d:x});
    add('ok','Connection','Read the Court Vision 2.0 workbook through your reports endpoint, read-only, using the access key saved on this device. Only whitelisted card fields were returned; buyer names, addresses, contact details and payment details never reach this page.');
    commonChecks(p,add);
    const w=d.meta&&d.meta.workbookChecks;
    if(w)add((w.error||0)+(w.warning||0)>0?'warn':'ok','The workbook\'s own data checks',(w.error||0)+' errors and '+(w.warning||0)+' warnings are reported by the workbook. They are not re-run here.');
    const l=d.meta&&d.meta.ledger;
    if(l&&l.rowsNotMarkedCounted>0)add('warn','Cash figure in the workbook is unreliable',l.rowsNotMarkedCounted+' ledger rows are not marked as counted. The workbook adds them on top of the latest balance count'+(l.lastCountAt?' ('+l.lastCountAt+')':'')+', so any of them the count already included are counted twice. Cash is therefore not shown here until this is verified.');
    tradeChecks(p,add);
    if(fr.level!=='ok'&&fr.title)add(fr.level==='warn'?'warn':'na',fr.title,fr.text);
    add('na','Not returned by the endpoint','Finance ledger rows, Balance counts, reserve transfers and receipts. Reserve transfers and balance, shipping reimbursements and suspected duplicate ledger rows cannot be checked here.');
    return C;
  }
  function payloadOf(r){
    let p=r&&r.payload;
    if(typeof p==='string'){try{p=JSON.parse(p);}catch(e){}}
    return p;
  }
  async function dl(mcp,id,refresh){
    const r=await mcp.callTool(SERVER,'download_file_content',{fileId:id,exportMimeType:'text/csv'},{cache:refresh?{staleTime:0,gcTime:60000,refresh:true}:{staleTime:60000,gcTime:300000}});
    const p=payloadOf(r);
    if(!p||typeof p.content!=='string')throw {code:'bad_payload',message:'Google Drive returned a response this page does not understand.'};
    return {text:b64ToText(p.content),storedAt:r.cache?r.cache.storedAt:Date.now()};
  }
  async function modified(mcp){
    const r=await mcp.callTool(SERVER,'search_files',{query:"title = 'Backend' or title = 'Court Vision 2.0'",pageSize:10,excludeContentSnippets:true},{cache:false});
    const p=payloadOf(r),out={};
    ((p&&p.files)||[]).forEach(f=>{if(f.id===SRC.backend)out.backend=f.modifiedTime;if(f.id===SRC.reporting)out.reporting=f.modifiedTime;});
    return out;
  }
  async function loadConnector(opts){
    const claude=window.claude;
    if(!claude||!claude.use)throw {code:'no_runtime',message:'This page is not running inside the Claude viewer.'};
    const mcp=await claude.use('mcp');
    if(!mcp)throw {code:'capability_disabled',message:'Live connectors are not available in this view.'};
    /* First call may show the viewer a permission prompt, so it runs alone and is retried once if the prompt was still open. */
    let bv;
    try{bv=await dl(mcp,SRC.backend,opts.refresh);}
    catch(e){
      if(e&&e.retryable){await new Promise(r=>setTimeout(r,Math.min(e.retryAfterMs||1500,5000)));bv=await dl(mcp,SRC.backend,opts.refresh);}
      else throw e;
    }
    const [o,m]=await Promise.allSettled([dl(mcp,SRC.reporting,opts.refresh),modified(mcp)]);
    const asOf=CVU.todayLocal();
    const p=toSnapshot(parseCSV(bv.text),asOf);
    const ovMap=o.status==='fulfilled'?parseOverview(o.value.text):null;
    const mod=m.status==='fulfilled'?m.value:{};
    const now=Date.now(),fr=freshness(mod,now);
    const checks=buildChecks(p,ovMap,fr,o.status==='rejected'?describeError(o.reason).text:null);
    return {meta:{source:'live',via:'connector',asOf,retrievedAt:bv.storedAt||now,label:'Backend workbook, Cards tab (read-only)',freshness:fr,checks,ovCheck:ovMap?CVCalc.crossCheck(p.cards,ovMap):null,counts:p.statusCounts,tradeGroups:p.tradeGroups},cards:p.cards,funds:null,reserve:null};
  }
  async function callEndpoint(){
    const key=accessKey();
    if(!key)throw {code:'UNAUTHORIZED',message:'This device has no access key.'};
    const ctl=typeof AbortController!=='undefined'?new AbortController():null,t=ctl?setTimeout(()=>ctl.abort(),30000):null;
    let res;
    try{
      res=await fetch(endpoint(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'getReportData',payload:{key:key}}),signal:ctl?ctl.signal:undefined});
    }catch(e){throw {code:e&&e.name==='AbortError'?'timeout':'network',message:String(e&&e.message||e)};}
    finally{if(t)clearTimeout(t);}
    let j;try{j=await res.json();}catch(e){throw {code:'bad_payload',message:'The reports endpoint did not return readable data.'};}
    if(!j||!j.success)throw {code:(j&&j.code)||'upstream_error',message:(j&&j.message)||'The reports endpoint reported an error.'};
    return j.data;
  }
  async function loadEndpoint(){
    const d=await callEndpoint();
    const asOf=(d.meta&&d.meta.asOf)||CVU.todayLocal();
    const p=build(d.cards||[],asOf);
    const ma=(d.meta&&d.meta.modifiedAt)||{};
    const fr=freshness({backend:ma.source,reporting:ma.reporting},Date.now());
    return {meta:{source:'live',via:'endpoint',asOf,retrievedAt:Date.now(),label:'Court Vision 2.0 workbook, through your reports endpoint (read-only)',freshness:fr,checks:buildChecksEndpoint(p,d,fr),ovCheck:null,counts:p.statusCounts,tradeGroups:p.tradeGroups,user:d.user,ledger:(d.meta&&d.meta.ledger)||null},cards:p.cards,funds:null,reserve:null};
  }
  async function load(opts){return useEndpoint()?loadEndpoint():loadConnector(opts||{});}
  function describeError(e){
    const code=(e&&e.code)||'unknown',msg=(e&&e.message)||'';
    const M={
      no_runtime:['Live connection unavailable','This page needs to run inside the Claude viewer to reach Google Drive.',false],
      capability_disabled:['Live connection unavailable','Connectors are not available in this view. Open the page from claude.ai.',false],
      not_granted:['Permission not granted','This view was not allowed to use connectors.',false],
      server_not_connected:['Google Drive is not connected','Add Google Drive in claude.ai under Settings, then Connectors, and try again.',true],
      selection_required:['Choose a Google Drive connection','You have more than one Google Drive connector. Choose one when asked, then try again.',true],
      needs_reauth:['Reconnect Google Drive','Your Google Drive sign-in has expired. Reconnect it in claude.ai under Settings, then Connectors.',true],
      not_in_manifest:['Permission declined','Access to Google Drive was declined for this page. Allow it in the page permissions, then try again.',true],
      consent_required:['Permission declined','Access to Google Drive was declined for this page. Allow it, then try again.',true],
      approval_required:['Approval needed','Google Drive needs your approval for this read. Press Try again and allow it.',true],
      blocked_by_policy:['Blocked by your organization','Your organization\'s policy blocks this Google Drive read.',false],
      tool_error:['Google Drive could not read the workbook','Drive reported: '+(msg||'an error')+'. Check that you can open the workbook with your Google account.',true],
      server_unavailable:['Google Drive did not respond','This is usually temporary. Try again in a moment.',true],
      upstream_error:['The data source did not respond','This is usually temporary. Try again in a moment.',true],
      rate_limited:['Too many requests','Wait a moment, then try again.',true],
      layout:['The workbook layout changed',msg,false],
      bad_payload:['Unexpected response',msg,true],
      UNAUTHORIZED:['No valid access key on this device','Open your private Court Vision link (the one ending in #k=...) once on this device to save the key, then reload this page.',false],
      NOT_CONFIGURED:['The reports key is not set up yet','Run generateReportKey once in the Apps Script editor, then open your private link.',false],
      network:['Could not reach the reports endpoint','Check your internet connection and the CV_ENDPOINT address, then try again.',true],
      timeout:['The reports endpoint took too long','Try again in a moment.',true],
      METHOD_NOT_ALLOWED:['The reports endpoint is not set up correctly',msg,false]
    };
    const x=M[code]||['Live data could not be loaded',(msg||'Unknown error')+' ('+code+')',true];
    return {code,title:x[0],text:x[1],retry:x[2],login:false};
  }
  /* Kept so the rest of the page keeps working. There is no password form any more. */
  function setCredentials(){}
  function signOut(){try{localStorage.removeItem(KEY_NAME);}catch(e){}}   /* "Sign out" now forgets the key on this device */
  return {SRC,parseCSV,b64ToText,toSnapshot,build,parseOverview,freshness,buildChecks,buildChecksEndpoint,load,describeError,setCredentials,signOut,useEndpoint,STALE_HOURS};
})();
</script>
